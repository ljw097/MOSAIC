<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="system-ui, sans-serif" font-size="13">
  <rect width="900" height="390" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2329">MOSAIC 마름모(◇) 다중 경로 분할 — 메시지 1개 = k-of-n 조각</text>
  <g stroke="#3fb68b" stroke-width="2" fill="none">
    <path d="M70 190 L180 100 L740 100 L830 190"/>
    <path d="M70 190 L180 190 L740 190 L830 190"/>
    <path d="M70 190 L180 280 L740 280 L830 190"/>
  </g>
  <g fill="#e8f6f0" stroke="#2c8a68" stroke-width="1.5">
    <circle cx="70" cy="190" r="40"/><circle cx="830" cy="190" r="40"/>
  </g>
  <text x="70" y="186" text-anchor="middle" font-weight="700">client</text>
  <text x="70" y="202" text-anchor="middle" font-size="11">분할</text>
  <text x="830" y="186" text-anchor="middle" font-weight="700">exit</text>
  <text x="830" y="202" text-anchor="middle" font-size="11">k개로 복원</text>
  <g font-size="12" text-anchor="middle">
    <g fill="#f4f6f8" stroke="#8796a5">
      <rect x="160" y="85" width="56" height="30" rx="6"/><rect x="290" y="85" width="56" height="30" rx="6"/><rect x="430" y="85" width="56" height="30" rx="6"/><rect x="570" y="85" width="56" height="30" rx="6"/>
      <rect x="160" y="175" width="56" height="30" rx="6"/><rect x="290" y="175" width="56" height="30" rx="6"/><rect x="430" y="175" width="56" height="30" rx="6"/><rect x="570" y="175" width="56" height="30" rx="6"/>
      <rect x="160" y="265" width="56" height="30" rx="6"/><rect x="290" y="265" width="56" height="30" rx="6"/><rect x="430" y="265" width="56" height="30" rx="6"/>
    </g>
    <rect x="570" y="265" width="56" height="30" rx="6" fill="#fde8e8" stroke="#c0392b"/>
    <text x="188" y="105">G1</text><text x="318" y="105">L1a</text><text x="458" y="105">L2a</text><text x="598" y="105">L3a</text>
    <text x="188" y="195">G2</text><text x="318" y="195">L1b</text><text x="458" y="195">L2b</text><text x="598" y="195">L3b</text>
    <text x="188" y="285">G1</text><text x="318" y="285">L1c</text><text x="458" y="285">L2c</text><text x="598" y="285" fill="#c0392b">L3c ✕</text>
  </g>
  <text x="598" y="316" text-anchor="middle" font-size="11" fill="#c0392b">장악된 노드가 조각을 버려도</text>
  <text x="598" y="331" text-anchor="middle" font-size="11" fill="#c0392b">남은 k개로 복원</text>
  <g font-size="12" fill="#44515d">
    <text x="40" y="362">• 계층마다 서로 다른 믹스 → 노드 하나는 메시지당 조각 ≤ 1개만 봄 (k-1개 이하로는 정보 0)</text>
    <text x="40" y="380">• k, n은 메시지마다 무작위 · 응답(exit → client)도 SURB 묶음으로 같은 마름모</text>
  </g>
</svg>
